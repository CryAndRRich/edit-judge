# Scorer (python -m src.scorer embed | baselines | train | report). Design and results: ../docs/scorer.md.
#   backbones: clip-l14 | pickscore | siglip | hpsv2 | dinov2 (src/scorer/backbones/__init__.py)
#   inputs:    "vec" (e, e - o, e * t) and/or "sim" (cosine similarities, |e - o|)
#   head:      linear | mlp
#   loss:      bt (hard labels) | soft (p of the final ranking) | uncertainty (HPSv3-style Gaussian scores)
#   text:      instruction (simplified instruction; the request when a sample has none) | request (as written)

version = "all"         # all (data/pairs.jsonl), or v1 / v2 (needs work/ranking: coordinator only)

[embed]
backbones = ["clip-l14", "pickscore", "siglip", "hpsv2", "dinov2"]

[train]                 # defaults for every run; a run may override any of them
text = "instruction"
hidden = 64
dropout = 0.3
input_dropout = 0.1
lr = 1e-4
weight_decay = 0.05
batch_size = 256
epochs = 200
patience = 8            # epochs without a lower dev loss
seeds = [0, 1, 2, 3, 4] # one head per seed; a run's score is their mean (standardised)

# 1. Linear heads: on the similarities of every backbone (the most readable), and on SigLIP's vectors
[[runs]]
name = "linear-sim-all"
backbones = ["clip-l14", "pickscore", "siglip", "hpsv2", "dinov2"]
inputs = ["sim"]
head = "linear"
loss = "soft"

[[runs]]
name = "linear-vec-siglip"
backbones = ["siglip"]
inputs = ["vec", "sim"]
head = "linear"
loss = "soft"
weight_decay = 0.5

# 2. MLP on SigLIP (the pilot's best): soft vs hard labels, instruction vs request
[[runs]]
name = "mlp-siglip"
backbones = ["siglip"]
loss = "soft"

[[runs]]
name = "mlp-siglip-bt"
backbones = ["siglip"]
loss = "bt"

[[runs]]
name = "mlp-siglip-request"
backbones = ["siglip"]
loss = "soft"
text = "request"

# 3. MLP on every backbone: Bradley-Terry vs uncertainty loss
[[runs]]
name = "mlp-all"
backbones = ["clip-l14", "pickscore", "siglip", "hpsv2", "dinov2"]
loss = "soft"

[[runs]]
name = "mlp-all-uncertainty"
backbones = ["clip-l14", "pickscore", "siglip", "hpsv2", "dinov2"]
loss = "uncertainty"

# Scorer pilot (python -m src.scorer train|report): heads trained on cached embeddings of frozen backbones.
# See docs/scorer-survey.md for the design. Every run needs the embeddings of its backbones
# (python -m src.scorer embed --backbone NAME).
#   backbones: clip-l14 | pickscore | siglip | dinov2 (src/scorer/backbones/__init__.py)
#   inputs:    "vec" (e, e - o, e * t) and/or "sim" (cosine similarities, |e - o|)
#   head:      linear | mlp
#   loss:      bt (hard labels) | soft (p_a of the final ranking) | uncertainty (HPSv3-style Gaussian scores)

version = "v1"

[train]                 # defaults for every run; a run may override any of them
hidden = 256
dropout = 0.2
lr = 1e-3
weight_decay = 1e-2
batch_size = 256
epochs = 100
patience = 10
seed = 2026

# 1. Feature-based Bradley-Terry: logistic regression on similarity features (the T-061 plan, from embeddings)
[[runs]]
name = "linear-sim-all"
backbones = ["clip-l14", "pickscore", "siglip", "dinov2"]
inputs = ["sim"]
head = "linear"
loss = "soft"

# 2. Small MLP head on one backbone; soft vs hard labels
[[runs]]
name = "mlp-clip-soft"
backbones = ["clip-l14"]
inputs = ["vec", "sim"]
loss = "soft"

[[runs]]
name = "mlp-clip-bt"
backbones = ["clip-l14"]
inputs = ["vec", "sim"]
loss = "bt"

[[runs]]
name = "mlp-pickscore-soft"
backbones = ["pickscore"]
inputs = ["vec", "sim"]
loss = "soft"

[[runs]]
name = "mlp-siglip-soft"
backbones = ["siglip"]
inputs = ["vec", "sim"]
loss = "soft"

# 3. Alignment (SigLIP) + preservation (DINOv2), and all backbones; soft vs uncertainty loss
[[runs]]
name = "mlp-siglip-dino-soft"
backbones = ["siglip", "dinov2"]
inputs = ["vec", "sim"]
loss = "soft"

[[runs]]
name = "mlp-all-soft"
backbones = ["clip-l14", "pickscore", "siglip", "dinov2"]
inputs = ["vec", "sim"]
loss = "soft"

[[runs]]
name = "mlp-all-uncertainty"
backbones = ["clip-l14", "pickscore", "siglip", "dinov2"]
inputs = ["vec", "sim"]
loss = "uncertainty"

<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EditJudge Studio</title>
  <meta name="description" content="A photo editing assistant: it reads your request, runs the best-ranked editing models and scores every edit.">
  <meta name="theme-color" content="#f4f8f5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Cpath d='M9 21.5l4.5-5.5 3.5 3.5 6-8' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // the theme before the first paint: the saved choice, light by default
    try { if (localStorage.getItem("ej-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (error) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
  <link rel="stylesheet" href="/static/css/assistant.css?v={{ version }}">
</head>
<body>
  <!-- the whole window: blurred columns of photos falling (filled by app.js) -->
  <div class="backdrop" aria-hidden="true">
    <div class="collage" id="collage"></div>
    <div class="veil"></div>
  </div>

  <header class="topbar">
    <a class="brand" href="#assistant" aria-label="EditJudge Studio home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-6 4 4 7-9"/></svg>
      </span>
      <span class="brand-name">EditJudge <span class="brand-light">Studio</span></span>
    </a>
    <span class="topbar-sep" aria-hidden="true"></span>
    <div class="segmented view-switch" role="tablist" aria-label="View">
      <span class="tab-pill" aria-hidden="true"></span>
      <button id="tab-assistant" class="active" role="tab" aria-selected="true">Assistant</button>
      <button id="tab-rankings" role="tab" aria-selected="false">Rankings</button>
      <button id="tab-dataset" role="tab" aria-selected="false">Dataset</button>
    </div>
    <div class="spacer"></div>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <section class="masthead">
    <div class="masthead-inner">
      <h1>One prompt. <span class="soft">Best models. Flawless edits.</span></h1>
    </div>
  </section>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" aria-label="Controls">
      <div class="inspector">
        <section class="panel">
          <h2 class="section-title"><span class="step">01</span>Upload image</h2>
          <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload an image: drop a file, paste it, or press Enter to browse">
            <div class="dz-empty">
              <div class="dz-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-4.5-4.5L6 21"/></svg></div>
              <div class="dz-title">Drop an image here</div>
            </div>
            <input type="file" id="file-input" accept="image/*" class="sr-only" tabindex="-1">
          </div>
          <div class="sub-title">Sample image</div>
          <div class="samples" id="samples"></div>
        </section>

        <section class="panel">
          <h2 class="section-title"><span class="step">02</span>Request</h2>
          <div class="composer">
            <label for="instruction" class="sr-only">Editing request</label>
            <textarea id="instruction" rows="1" maxlength="100" placeholder="Describe the edit, e.g. Remove the person in the back"></textarea>
            <div class="composer-foot">
              <span id="char-count">0 / 100</span>
            </div>
          </div>

          <div class="route-box hidden" id="route-box" aria-live="polite"></div>

          <button class="run-btn" id="run-btn" type="button" disabled>
            <span id="run-label">Process</span>
          </button>
          <div class="progress hidden" id="progress">
            <div class="progress-head"><span id="progress-text">Starting</span><span id="progress-count"></span></div>
            <div class="bar-track"><div class="bar-fill" id="progress-bar"></div></div>
          </div>
        </section>
      </div>
    </aside>

    <main class="main" id="main">
      <div id="view-assistant" class="results">
        <section class="surface hero solo" id="hero"></section>
        <section class="toolbar">
          <div class="toolbar-title">Edit models</div>
        </section>
        <section class="grid" id="grid" aria-label="Edit models" aria-live="polite"></section>
      </div>
      <div id="view-rankings" class="results hidden">
        <div class="rank-grid" id="rank-grid"></div>
      </div>
      <div id="view-dataset" class="results hidden"></div>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <script src="/static/js/app.js?v={{ version }}"></script>
</body>
</html>
